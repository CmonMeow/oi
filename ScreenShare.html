<!doctype html>
<html lang="en"><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src blob:; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screen share</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d0b;color:#d5ece2;font:15px Segoe UI,sans-serif}header{padding:16px;background:#101b16;border-bottom:1px solid #315044}button{font:inherit;padding:8px 15px;border:1px solid #56ba88;background:#173a2b;color:#e5ffef;cursor:pointer}button:disabled{opacity:.5;cursor:default}#status{margin:10px 0 0;color:#97b4a6}#status:empty{display:none}main{display:flex;flex-wrap:wrap;gap:16px;padding:16px}section{flex:1;min-width:260px}h2{font-size:14px;font-weight:400;color:#83d7ac}video{width:100%;max-height:75vh;background:#000;object-fit:contain}#localSection,#remoteSection,#stop{display:none}
</style>
<header><button id="choose">Choose screen or window</button> <button id="stop">Stop sharing</button>
<p id="status"></p></header>
<main><section id="localSection"><h2>Your screen</h2><video id="local" autoplay muted playsinline></video></section>
<section id="remoteSection"><h2>Watching screen</h2><video id="remote" autoplay muted playsinline controls controlslist="nodownload noplaybackrate" disablepictureinpicture></video></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id), peers=new Map(), pendingJobs=new Set();
let stream=null, share='', picking=false;
const tell=(type,peer=-1,id='',connection='',payload='')=>chrome.webview.postMessage([type,peer,id,connection,payload].join('\n'));
const status=text=>{$('status').textContent=text};
const fail=text=>{status(text);tell('error',-1,'','',text)};
const id=()=>crypto.randomUUID().replaceAll('-','');
// Never exchange real ICE endpoints, including candidates embedded in SDP.
function relayDescription(description){
 const sdp=description.sdp.split(/\r?\n/).filter(line=>!/^a=(candidate:|remote-candidates:|end-of-candidates)/.test(line)).map(line=>{
  if(line.startsWith('o='))return 'o=- 0 0 IN IP4 127.0.0.1';
  if(line.startsWith('c='))return 'c=IN IP4 0.0.0.0';
  if(line.startsWith('a=rtcp:'))return 'a=rtcp:9 IN IP4 0.0.0.0';
  return line.replace(/^m=(video|audio) \S+ /,'m=$1 9 ');
 }).join('\r\n');
 return {type:description.type,sdp};
}
const codecs=role=>{
 const caps=(role==='send'?RTCRtpSender:RTCRtpReceiver).getCapabilities('video');
 const h264=caps?.codecs.filter(c=>c.mimeType.toLowerCase()==='video/h264')||[];
 if(!h264.length) throw Error('H264 is unavailable in this WebView2 runtime. Update Microsoft Edge WebView2.');
 return [...h264,...caps.codecs.filter(c=>c.mimeType.toLowerCase()==='video/rtx')];
};
const audioCodecs=role=>{
 const caps=(role==='send'?RTCRtpSender:RTCRtpReceiver).getCapabilities('audio');
 const opus=caps?.codecs.filter(c=>c.mimeType.toLowerCase()==='audio/opus')||[];
 if(!opus.length)throw Error('Screen audio is unavailable in this WebView2 runtime.');
 return opus;
};
function validateDescription(sdp){
 if(typeof sdp!=='string')throw Error('Invalid screen negotiation.');
 const media=sdp.split(/(?=^m=)/m).filter(s=>s.startsWith('m='));
 if(media.length<1||media.length>2||!/^m=video /m.test(media[0])||!/^a=rtpmap:\d+ H264\/90000\r?$/m.test(media[0]))throw Error('Screen peer did not offer H264 video.');
 if(media.length===2&&(!/^m=audio /m.test(media[1])||!/^a=rtpmap:\d+ opus\/48000\/2\r?$/im.test(media[1])))throw Error('Invalid screen audio negotiation.');
}
function drop(connection,notify=true){
 for(const job of pendingJobs)if(job.key===connection)job.cancelled=true;
 const p=peers.get(connection);if(!p)return;
 peers.delete(connection);clearTimeout(p.timeout);p.pc.close();
 p.resolvePort(0);tell('relay-close',p.peer,p.share,connection);
 if(p.role==='receive'){$('remote').srcObject=null;$('remoteSection').style.display='none';}
 if(notify)tell('close',p.peer,p.share,connection);
}
function stop(){
 if(stream){for(const track of stream.getTracks())track.stop();stream=null;}
 const old=share;share='';for(const [connection,p] of peers)if(p.role==='send')drop(connection);
 for(const job of pendingJobs)if(job.type==='watch'&&job.shared===old)job.cancelled=true;
 $('local').srcObject=null;$('localSection').style.display='none';$('stop').style.display='none';$('choose').disabled=false;
 if(old)tell('stop',-1,old);status('');
}
function connection(peer,shared,key,role){
 if(peers.has(key))return peers.get(key);
 if(peers.size>=25)throw Error('Too many screen connections.');
 const pc=new RTCPeerConnection({iceServers:[],bundlePolicy:'max-bundle',rtcpMuxPolicy:'require'});
 const p={pc,peer,share:shared,role};peers.set(key,p);
 p.port=new Promise(resolve=>{p.resolvePort=resolve;});
 tell('relay-open',peer,shared,key);
 pc.onconnectionstatechange=()=>{
  if(peers.get(key)!==p)return;
  if(pc.connectionState==='connected'){clearTimeout(p.timeout);status('');}
  if(pc.connectionState==='failed'){drop(key);fail('Screen relay connection failed.');}
 };
 pc.ontrack=e=>{if(peers.get(key)!==p||role!=='receive'||!['video','audio'].includes(e.track.kind)){e.track.stop();return;}
  if(!p.received)p.received=new MediaStream();
  if(p.received.getTracks().some(t=>t.kind===e.track.kind)){e.track.stop();return;}
  p.received.addTrack(e.track);$('remote').srcObject=p.received;$('remoteSection').style.display='block';};
 p.timeout=setTimeout(()=>{if(peers.has(key)&&pc.connectionState!=='connected'){drop(key);fail('Screen relay connection timed out.');}},30000);
 return p;
}
async function requestWatch(peer,shared){
 codecs('receive');for(const [key,p] of peers)if(p.role==='receive')drop(key);
 const key=id(),p=connection(peer,shared,key,'receive');
 p.pc.addTransceiver('video',{direction:'recvonly'}).setCodecPreferences(codecs('receive'));
 tell('watch',peer,shared,key);status('Connecting...');
}
async function startPeer(peer,shared,key){
 if(!stream||share!==shared){tell('close',peer,shared,key);return;}
 const p=connection(peer,shared,key,'send');
 const sender=p.pc.addTrack(stream.getVideoTracks()[0],stream);
 p.pc.getTransceivers()[0].setCodecPreferences(codecs('send'));
 const audio=stream.getAudioTracks()[0];let audioSender;
 if(audio){audioSender=p.pc.addTrack(audio,stream);p.pc.getTransceivers().find(t=>t.sender===audioSender).setCodecPreferences(audioCodecs('send'));}
 await p.pc.setLocalDescription(await p.pc.createOffer());
 const params=sender.getParameters();if(params.encodings?.length){params.encodings[0].maxBitrate=2000000;params.encodings[0].maxFramerate=60;await sender.setParameters(params);}
 if(audioSender){const audioParams=audioSender.getParameters();if(audioParams.encodings?.length){audioParams.encodings[0].maxBitrate=96000;await audioSender.setParameters(audioParams);}}
 if(peers.has(key))tell('signal',peer,shared,key,JSON.stringify({description:relayDescription(p.pc.localDescription)}));
}
async function signal(peer,shared,key,body){
 const p=peers.get(key);if(!p||p.peer!==peer||p.share!==shared)return;
 const data=JSON.parse(body);
 if(data.description){
  if(p.descriptionReceived)throw Error('Duplicate screen negotiation.');
  p.descriptionReceived=true;
  if(data.description.type!==(p.role==='receive'?'offer':'answer'))throw Error('Invalid screen negotiation.');
  // Only H264 video and one optional Opus audio stream; never data channels.
  validateDescription(data.description.sdp);
  await p.pc.setRemoteDescription(relayDescription(data.description));
  if(p.role==='receive')for(const t of p.pc.getTransceivers())if(t.receiver.track.kind==='audio'){t.direction='recvonly';t.setCodecPreferences(audioCodecs('receive'));}
  const port=await p.port;if(!port||peers.get(key)!==p)return;
  await p.pc.addIceCandidate({candidate:`candidate:1 1 udp 2122260223 127.0.0.1 ${port} typ host`,sdpMLineIndex:0});
  if(p.role==='receive'){await p.pc.setLocalDescription(await p.pc.createAnswer());if(peers.get(key)===p)tell('signal',peer,shared,key,JSON.stringify({description:relayDescription(p.pc.localDescription)}));}
 }else throw Error('Direct screen connection information is not accepted.');
}
$('choose').onclick=async()=>{
 if(picking||stream)return;picking=true;$('choose').disabled=true;
 try{
  codecs('send');stream=await navigator.mediaDevices.getDisplayMedia({video:{width:{max:1920},height:{max:1080},frameRate:{ideal:60,max:60}},audio:true,systemAudio:'include',windowAudio:'window'});
  share=id();const captured=stream,track=captured.getVideoTracks()[0];track.contentHint='detail';track.onended=()=>{if(stream===captured)stop();};
  $('local').srcObject=stream;$('localSection').style.display='block';$('stop').style.display='inline-block';
  tell('start',-1,share);status('Waiting for viewers.');
 }catch(e){if(stream)stop();if(e.name==='NotAllowedError')status('Screen selection cancelled.');else fail(e.message);$('choose').disabled=false;}
 finally{picking=false;}
};
$('stop').onclick=stop;
let chain=Promise.resolve();
chrome.webview.addEventListener('message',event=>{
 const parts=event.data.split('\n'),type=parts.shift(),peer=Number(parts.shift()),shared=parts.shift(),key=parts.shift(),body=parts.join('\n');
 if(type==='relay-port'){
  const p=peers.get(key);if(!p||p.peer!==peer||p.share!==shared)return;
  const port=Number(body);if(!Number.isInteger(port)||port<1||port>65535){drop(key);fail('Could not open the local screen relay.');return;}
  p.resolvePort(port);return;
 }
 // Closing media must not wait behind asynchronous negotiation work.
 if(type==='stop-local'){stop();return;}
 if(type==='close'){for(const job of pendingJobs)if(job.key===key)job.cancelled=true;drop(key,false);if(body)fail(body);return;}
 if(type==='stop'){for(const job of pendingJobs)if(job.shared===shared)job.cancelled=true;if(share===shared)stop();for(const [connection,p]of peers)if(p.share===shared)drop(connection,false);if(body)fail(body);else status('Screen share ended.');return;}
 if(pendingJobs.size>=256){if(key)drop(key);fail('Too many pending screen requests.');return;}
 const job={type,shared,key,cancelled:false};pendingJobs.add(job);
 chain=chain.then(async()=>{
  if(job.cancelled)return;
  if(type==='choose'){ $('choose').focus();return; }
  if(type==='view'){await requestWatch(peer,shared);return;}
  if(type==='watch'){await startPeer(peer,shared,key);return;}
  if(type==='signal'){await signal(peer,shared,key,body);return;}
 }).catch(e=>{if(key&&!peers.has(key)&&e.name==='InvalidStateError')return;if(key)drop(key);fail(e.message||'Screen connection failed.');}).finally(()=>{pendingJobs.delete(job);});
});
const videoRates=['local','remote'].map(name=>{
 const video=$(name),rate={video,frames:0};
 const frame=()=>{++rate.frames;video.requestVideoFrameCallback(frame);};
 video.requestVideoFrameCallback(frame);return rate;
});
let videoTime=performance.now();
setInterval(()=>{
 const now=performance.now(),elapsed=(now-videoTime)/1000;videoTime=now;
 const values=videoRates.flatMap(rate=>{
  const active=rate.video.srcObject!==null;
  const values=active?[rate.video.videoWidth,rate.video.videoHeight,Math.round(rate.frames/elapsed)]:[0,0,0];
  rate.frames=0;return values;
 });
 tell('video',-1,'','',values.join(','));
},1000);
let sampling=false;
setInterval(async()=>{
 if(sampling)return;sampling=true;
 for(const [key,p]of peers){
  try{const stats=await p.pc.getStats();
   for(const s of stats.values()){
    if((s.type==='inbound-rtp'||s.type==='outbound-rtp')&&s.kind==='video'){
     const codec=stats.get(s.codecId);if(codec&&!/video\/(H264|rtx)$/i.test(codec.mimeType)){drop(key);fail('Screen connection negotiated an unexpected codec.');break;}
    }
    if(s.type==='transport'&&s.selectedCandidatePairId){const pair=stats.get(s.selectedCandidatePairId),remote=pair&&stats.get(pair.remoteCandidateId);if(remote?.address&&remote.address!=='127.0.0.1'){drop(key);fail('Non-relayed screen connection rejected.');break;}}
   }
  }catch(e){if(peers.has(key)){drop(key);fail('Screen statistics failed.');}}
 }
 sampling=false;
},1000);
tell('ready');
</script></html>
